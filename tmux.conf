# --- Settings ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

set-option -sg escape-time 10
set-option -g repeat-time 10
set-option -g focus-events on
set -g renumber-windows on          # renumber all windows when any window is closed
set -g base-index 1                 # start indexing windows at 1 instead of 0
set -g mouse on
set -g default-terminal "screen-256color"
set-window-option -g mode-keys vi   # Set Vi Mode

# prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind _ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Vi mode bindings (enter in copy-mode-vi with < prefix + [ >)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Design ---
# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=grey'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=grey'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=grey'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=grey bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=grey]#F '

setw -g window-status-bell-style 'fg=white bg=grey bold'

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=grey'
set -g pane-active-border-style 'fg=green'


# --- Plugin Manager ---
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin 'sainnhe/tmux-fzf'

# Customize resurrect folder. Start tmux at boot
set -g @resurrect-dir "~/.config/tmux/resurrect"
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Prevent yank from scrolling to the bottom of your buffer after copying.
set -g @yank_action "copy-pipe"

# Initialize TMUX plugin manager 
run '~/.config/tmux/plugins/tpm/tpm'
